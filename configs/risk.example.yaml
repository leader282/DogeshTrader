# Risk engine configuration. These are *conservative* defaults for an
# individual retail account. Always start lower than your real risk appetite
# and raise the limits only after extensive paper testing.

# Hard cap per single order. Strategy quantity is clipped, not allowed to bypass.
max_order_quantity: 100

# Hard cap on notional value per single order in INR.
max_order_notional: 100000

# Hard cap on total open position notional across all instruments in INR.
max_position_notional: 250000

# Stop trading once realised + unrealised loss for the day exceeds this in INR
# (positive number; loss is compared as absolute).
max_daily_loss: 5000

# Maximum number of *open* (pending or partially-filled) broker orders allowed.
max_open_orders: 10

# Reject unprotected MARKET orders unless market_protection is also set.
require_market_protection: true
default_market_protection_pct: 1.0   # +/- 1% protection band

# Allow- and block-lists. If allowed_instruments is non-empty it acts as a
# whitelist; otherwise everything not in blocked_instruments is permitted.
# Use either "EXCHANGE:TRADINGSYMBOL" or just "TRADINGSYMBOL".
allowed_instruments: []
blocked_instruments: []

# Trading session window (IST). Strategies that need pre-open / post-close must
# explicitly extend this.
session_start: "09:15"
session_end: "15:30"
flatten_before_close_minutes: 5

# Circuit breakers.
max_consecutive_rejections: 3
data_feed_disconnect_grace_seconds: 30

# How DogeshTrader behaves at session edges.
no_new_orders_in_last_minutes: 5

# Order rate budget for the risk engine (in addition to the rate limiter).
max_orders_per_minute: 60
